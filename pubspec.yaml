
name: marea
description: "MAREA: conecta, crea y crece."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  supabase_flutter: ^2.17.2
  go_router: ^17.4.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  mapbox_maps_flutter: 3.34.2
  pointer_interceptor: 0.10.1+3
  geolocator: ^14.0.2
  http: ^1.5.0
  latlong2: ^0.9.1
  flutter_web_plugins:
    sdk: flutter
  share_plus: ^13.3.0
  uuid: ^4.6.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.1
  shared_preferences: ^2.5.5
  camera: ^0.12.1
  panorama_viewer: ^2.0.7
  path_provider: ^2.1.6
  image: ^4.10.1
  xml: ^7.0.1
  photo_manager: ^3.12.0
  file_selector: ^1.1.0
  google_mlkit_translation: 0.15.1
  google_mlkit_language_id: 0.15.1
  qr: 3.0.2

dev_dependencies:
  mapbox_maps_flutter_platform_interface: 3.34.2
  flutter_test:
    sdk: flutter
  image_picker_platform_interface: ^2.11.1
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  file_selector_platform_interface: 2.7.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/MAREA.png"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/brand/MAREA.png
    - assets/brand/MAREA_LOGOTIPO.png
    - assets/onboarding/
    - assets/auth_design/
    - assets/profile/mareadin-phone.png
    - assets/missions/fiebrin-explorador.webp

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-ExtraBold.ttf
          weight: 800
