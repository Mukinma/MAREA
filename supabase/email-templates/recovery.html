<h2>Recupera tu acceso a MAREA</h2>
<p>Introduce este código en «Recupera tu acceso» para elegir una contraseña nueva:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:4px">{{ .Token }}</p>
<p>MAREA nunca te pedirá que compartas este código. Si no solicitaste el cambio, ignora el mensaje: tu contraseña no cambia.</p>
